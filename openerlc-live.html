<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenERLC</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--muted:#6b6b6b;--card:#f2f3f5;--line:#dcdde0;--accent:#c0392b;--me:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#141518;--fg:#ececec;--muted:#999;--card:#212328;--line:#33363c;--accent:#ff6b5b;--me:#a8372b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column}
header{padding:.8rem 1rem;border-bottom:1px solid var(--line)}
header b{color:var(--accent);font-size:1.15rem}header span{color:var(--muted);font-size:.85rem;margin-left:.5rem}
#log{flex:1;overflow-y:auto;padding:1rem;max-width:760px;width:100%;margin:0 auto}
.m{margin:0 0 .8rem;padding:.6rem .9rem;border-radius:12px;max-width:88%;overflow-wrap:anywhere;white-space:pre-wrap}
.u{background:var(--me);color:#fff;margin-left:auto}.b{background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
.chips button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:.35rem .8rem;font:inherit;font-size:.85rem;cursor:pointer}
form{display:flex;gap:.5rem;padding:.7rem 1rem;border-top:1px solid var(--line);max-width:760px;width:100%;margin:0 auto}
input{flex:1;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;font:inherit}
.send{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:0 1.1rem;font:inherit;cursor:pointer}
button:disabled,input:disabled{opacity:.5}
</style></head><body>
<header><b>OpenERLC</b><span>Emergency Response: Liberty County assistant</span></header>
<div id="log">
  <div class="m b">Hi! I'm OpenERLC. Ask me anything about ER:LC.</div>
  <div class="chips" id="chips"></div>
</div>
<form id="f"><input id="q" autocomplete="off" maxlength="2000" placeholder="Ask about ER:LC..." aria-label="Message"><button class="send" id="s">Send</button></form>
<script>
var log=document.getElementById('log'),q=document.getElementById('q'),s=document.getElementById('s'),hist=[],busy=false;
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(t){return esc(t).replace(/\*\*([\s\S]+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
function add(cls,html){var d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function ask(text){
  text=text.trim();if(!text||busy)return;busy=true;
  var c=document.getElementById('chips');if(c)c.remove();
  add('u',esc(text));hist.push({role:'user',content:text});
  q.value='';q.disabled=s.disabled=true;var w=add('b','Thinking...');
  try{
    var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist.slice(-10)})});
    var raw=await r.text(),d={};try{d=JSON.parse(raw)}catch(_){}
    if(!r.ok||!d.reply){var detail=Array.isArray(d.detail)?d.detail.map(function(x){return (x.loc?x.loc.join('.')+': ':'')+x.msg}).join('; '):d.detail;throw new Error(detail||'Server returned HTTP '+r.status+'.')}
    w.innerHTML=md(d.reply);hist.push({role:'assistant',content:d.reply});
    var keys=Object.keys(d.sources||{});if(keys.length){var src=document.createElement('div');src.className='m b';src.innerHTML='Related pages: '+keys.map(function(k){return '<a href="'+esc(d.sources[k])+'" target="_blank" rel="noopener">'+esc(k)+'</a>'}).join(', ');log.appendChild(src)}
  }catch(e){w.textContent='Error: '+e.message;hist.pop()}
  busy=false;q.disabled=s.disabled=false;q.focus();log.scrollTop=log.scrollHeight;
}
document.getElementById('f').onsubmit=function(e){e.preventDefault();ask(q.value)};
['How do wanted levels work?','What teams are in ER:LC?','How do I become a police officer?'].forEach(function(t){
  var b=document.createElement('button');b.type='button';b.textContent=t;b.onclick=function(){ask(t)};document.getElementById('chips').appendChild(b)});
</script></body></html>
